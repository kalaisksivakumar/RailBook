
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RailBook - Group Passenger Booking</title>
    <link rel="stylesheet" href="style.css">

    <style>
        main {
            max-width: 950px;
            margin: 30px auto;
            padding: 20px;
        }

        .passenger-card,
        .occupancy-section,
        .selected-class-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 3px 12px #0002;
        }

        .selected-class-section {
            border-left: 5px solid #1976d2;
        }

        .passenger-card input,
        .passenger-card select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .seat-container {
            display: grid;
            grid-template-columns: repeat(5, minmax(45px, 60px));
            gap: 10px;
            justify-content: center;
            margin: 20px auto;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }

        .seat {
            padding: 12px 5px;
            border: 1px solid #aaa;
            border-radius: 8px;
            background: #e8f5e9;
            cursor: pointer;
            font-weight: bold;
        }

        .seat.selected {
            background: #1976d2;
            color: white;
        }

        .seat.unavailable {
            background: #ccc;
            color: #555;
            cursor: not-allowed;
        }

        .seat-message {
            text-align: center;
            color: red;
        }

        .action-button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        .remove-button {
            background: #d32f2f;
        }

        #passengerCount {
            font-weight: bold;
            margin: 15px 0;
        }

        /* COACH OCCUPANCY */

        .coach-card {
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .occupancy-bar {
            height: 14px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .occupancy-fill {
            height: 100%;
            background: #4caf50;
            border-radius: 10px;
        }

        .occupancy-details {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🚆 RailBook</h1>
    <p>Group Passenger Details & Seat Selection</p>
</header>

<main>

    <!-- SELECTED TRAVEL CLASS -->

    <section class="selected-class-section">

        <h2>Selected Travel Class</h2>

        <div id="selectedClassDetails">
            <p>Loading selected class...</p>
        </div>

    </section>

    <!-- COACH OCCUPANCY -->

    <section class="occupancy-section">

        <h2>Coach Occupancy</h2>

        <p>Check seat availability before selecting your seats.</p>

        <div id="coachOccupancy">
            <p>Loading coach occupancy...</p>
        </div>

    </section>

    <!-- PASSENGER BOOKING -->

    <h2>Enter Passenger Information</h2>

    <p id="passengerCount">Passengers: 1 / 6</p>

    <form id="passengerForm">

        <div id="passengerContainer"></div>

        <button type="button" id="addPassenger" class="action-button">
            + Add Passenger
        </button>

        <p id="formMessage" class="seat-message"></p>

        <button type="submit" class="action-button">
            Continue to Confirmation
        </button>

    </form>

</main>

<script src="passenger.js"></script>

</body>
</html>
